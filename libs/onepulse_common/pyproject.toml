[project]
name = "onepulse-common"
version = "0.1.0"
description = "Shared config, Postgres, and Foundry client library for OnePulse services"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19",
    "aiohttp>=3.9",
    "asyncpg>=0.30",
    "anthropic>=0.69",
    # azure-ai-projects real constraint, not >=2.6.0: agent-framework-foundry
    # pins <2.4.0. Verified live (2026-09-05) that the one call this project
    # makes against it — telemetry.get_application_insights_connection_string()
    # — still works correctly at 2.3.0, so this downgrade is a checked, not
    # assumed, non-issue.
    "azure-ai-projects>=2.2.0,<2.4.0",
    # Still real: kept for the classic-AgentsClient spike scripts
    # (foundry_agent_spike.py, ado_investigation_spike.py,
    # observability_spike.py, observability_export_run.py), which stay as
    # historical reference per convention — not deleted just because
    # run_pipeline.py migrated off this path.
    "azure-ai-agents>=1.1.0",
    "mcp>=2.1.1",
    "python-pptx>=1.0.2",
    "azure-core-tracing-opentelemetry>=1.0.0b13",
    "azure-monitor-opentelemetry>=1.8.9",
    "python-dotenv>=1.2.3",
    # Microsoft Agent Framework migration (Phase 0/Task 10) — primary path
    # for run_pipeline.py's four agents, superseding azure-ai-agents there.
    "agent-framework-core>=1.17.0",
    "agent-framework-foundry>=1.12.0",
    "openinference-instrumentation-agent-framework>=0.1.9",
    "arize-otel>=0.13.0",
    # Chat Assistant (Later-scope, pulled forward as scripts/chat_cli.py) —
    # real Retrieval Index (Physical Architecture Section 4). Verified live
    # (2026-09-06): the newer azure-ai-inference EmbeddingsClient 404s
    # against this Foundry resource's embedding deployment (its
    # `.services.ai.azure.com` unified route doesn't serve it); the classic
    # `openai` SDK's AzureOpenAI/AsyncAzureOpenAI client against
    # `<resource>.openai.azure.com`, authenticated via
    # `azure_ad_token_provider` (DefaultAzureCredential, no static key),
    # is the real, confirmed-working path.
    "azure-search-documents>=12.0.0",
    "openai>=3.8.0",
    # Migration Plan Phase 6: the ADO PAT moves out of a plain env var
    # into Key Vault, readable only by the Investigation identity.
    "azure-keyvault-secrets>=4.11.0",
    # Migration Plan Phase 4 (ADR-019): real Azure Storage Queues
    # (onepulsequeuesdev), Managed Identity / DefaultAzureCredential
    # auth only (allowSharedKeyAccess=false on the storage account) —
    # no account key, ever.
    "azure-storage-queue>=12.17.0",
    # Migration Plan Phase 1/2 (core_api, bff) — real, load-bearing gap
    # found only at Phase 5 (containerization): these were pip-installed
    # ad hoc into the local .venv across Tasks 40-41 and never actually
    # added here, so a fresh `pip install` (exactly what a container
    # image build does) would have silently failed to bring them in.
    # Every one of the four real services imports onepulse_common
    # transitively, so this one shared manifest is the correct, single
    # place for them — not four separate per-service requirements files.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "PyJWT>=2.13.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Real, load-bearing separation found at Phase 5 (containerization):
# streamlit was previously a hard dependency of this shared package, so
# every one of the four backend service images (none of which import
# streamlit at all — only Home.py does) paid its real, substantial size
# cost (streamlit itself plus pandas/numpy/pyarrow/altair/pydeck)
# unconditionally. Host-side local development installs this extra
# (`pip install -e libs/onepulse_common[ui]`, or it's already present in
# an existing venv from before this split — nothing to redo there);
# every Dockerfile in this project deliberately does not request it.
ui = [
    "streamlit>=1.63.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onepulse_common*"]
