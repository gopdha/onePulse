repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-no-secrets
        name: OnePulse project-specific secret pattern check
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: false
        always_run: true
